<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="planeBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="planeFold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="planeShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="planeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#3b82f6" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#planeGlow)" transform="translate(10, 10)">
    <!-- Main wings and folds -->
    <path d="M 20 110 L 130 20 L 70 120 Z" fill="url(#planeShadow)" opacity="0.9" />
    <path d="M 70 120 L 130 20 L 95 85 Z" fill="url(#planeFold)" />
    <path d="M 20 110 L 130 20 L 95 85 Z" fill="url(#planeBody)" />
    <!-- Underbody keel -->
    <path d="M 70 120 L 95 85 L 75 105 Z" fill="#1e40af" />
    <!-- Speed/air trail -->
    <path d="M 15 125 C 25 120 35 125 45 122" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M 5 138 C 20 134 35 138 50 132" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4" />
  </g>
</svg>
