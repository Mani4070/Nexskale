<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="mapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef2f8" />
      <stop offset="100%" stop-color="#e5eaf2" />
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="pinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e3a8a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="340" fill="url(#mapBg)" />

  <!-- City Zones / Blocks -->
  <path d="M 40 40 L 160 30 L 180 110 L 50 120 Z" fill="#e2e8f0" opacity="0.7" />
  <path d="M 210 20 L 340 10 L 330 90 L 220 95 Z" fill="#e2e8f0" opacity="0.6" />
  <path d="M 370 25 L 560 35 L 540 120 L 380 110 Z" fill="#e2e8f0" opacity="0.7" />
  <path d="M 60 160 L 190 150 L 170 260 L 40 240 Z" fill="#e2e8f0" opacity="0.6" />
  <path d="M 230 170 L 430 160 L 420 280 L 210 270 Z" fill="#e2e8f0" opacity="0.8" />
  <path d="M 470 150 L 580 160 L 570 290 L 460 270 Z" fill="#e2e8f0" opacity="0.6" />

  <!-- Green park zone -->
  <path d="M 460 50 C 490 60 520 80 500 110 C 480 130 440 120 440 90 Z" fill="#d1fae5" opacity="0.8" />
  <text x="475" y="90" font-family="system-ui, sans-serif" font-size="10" fill="#059669" font-weight="600">Botanical Garden</text>

  <!-- Road Network Lines -->
  <!-- Minor Roads -->
  <path d="M 0 60 Q 200 80 600 50" stroke="#ffffff" stroke-width="6" fill="none" />
  <path d="M 0 140 Q 300 160 600 130" stroke="#ffffff" stroke-width="8" fill="none" />
  <path d="M 0 220 Q 300 200 600 230" stroke="#ffffff" stroke-width="7" fill="none" />
  <path d="M 0 300 Q 250 280 600 310" stroke="#ffffff" stroke-width="6" fill="none" />

  <path d="M 100 0 Q 120 180 80 340" stroke="#ffffff" stroke-width="7" fill="none" />
  <path d="M 200 0 Q 180 150 210 340" stroke="#ffffff" stroke-width="9" fill="none" />
  <path d="M 360 0 Q 380 180 350 340" stroke="#ffffff" stroke-width="12" fill="none" />
  <path d="M 480 0 Q 460 170 490 340" stroke="#ffffff" stroke-width="7" fill="none" />

  <!-- Arterial Highway / Expressways -->
  <!-- Outer Ring Road / HITEC Main Road -->
  <path d="M 20 280 L 190 220 L 360 160 L 580 90" stroke="#93c5fd" stroke-width="8" fill="none" opacity="0.8" />
  <path d="M 20 280 L 190 220 L 360 160 L 580 90" stroke="#ffffff" stroke-width="4" fill="none" />

  <!-- Metro Rail Viaduct Line -->
  <path d="M 360 0 L 360 170 L 450 240 L 590 270" stroke="#6366f1" stroke-width="3" stroke-dasharray="6,4" fill="none" opacity="0.6" />

  <!-- Area Text Labels -->
  <text x="80" y="90" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" font-weight="700" letter-spacing="1">MADHAPUR</text>
  <text x="140" y="270" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" font-weight="800" letter-spacing="1.5">HITEC CITY</text>
  <text x="440" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" font-weight="700" letter-spacing="1">KONDAPUR</text>
  <text x="240" y="45" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" font-weight="600">CYBER TOWERS</text>
  <text x="420" y="310" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" font-weight="600">KNOWLEDGE CITY</text>

  <!-- Pulse Rings around NexSkale Location -->
  <circle cx="360" cy="160" r="38" fill="#3b82f6" opacity="0.12">
    <animate attributeName="r" values="24;44;24" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;0.05;0.2" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="360" cy="160" r="22" fill="#3b82f6" opacity="0.2" />

  <!-- NexSkale Custom Location Pin -->
  <g filter="url(#pinShadow)">
    <!-- Pill Badge -->
    <rect x="365" y="132" width="128" height="36" rx="18" fill="#0f172a" />
    <circle cx="383" cy="150" r="11" fill="url(#pinGrad)" />
    <!-- Logo inside circle -->
    <path d="M 379 154 L 379 146 L 383 151 L 387 146 L 387 154" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="400" y="154" font-family="system-ui, sans-serif" font-size="13" fill="#ffffff" font-weight="700">NexSkale</text>

    <!-- Pin Marker Point -->
    <path d="M 360 142 C 352 142 346 148 346 156 C 346 166 360 178 360 178 C 360 178 374 166 374 156 C 374 148 368 142 360 142 Z" fill="url(#pinGrad)" />
    <circle cx="360" cy="154" r="4.5" fill="#ffffff" />
  </g>
</svg>
